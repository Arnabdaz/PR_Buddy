[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testgen-mcp"
version = "0.1.0"
description = "MCP server for spec-driven unit test generation (deterministic core: gap detection, spec store, coverage parsing)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Arnab Das", email = "arnabdaz@users.noreply.github.com"},
]
keywords = ["mcp", "testing", "unit-tests", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
testgen-mcp = "testgen_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testgen_mcp_server"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "C4", "DTZ", "T10", "EM", "G", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PD", "PGH", "PL", "TRY", "NPY", "PERF", "RUF"]
ignore = ["ANN401", "S101", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "N802", "PLR2004", "PLC0415"]
"src/testgen_mcp_server/tools.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p no:anyio"
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
    "ignore:Module already imported so cannot be rewritten.*anyio:pytest.PytestAssertRewriteWarning"
]
